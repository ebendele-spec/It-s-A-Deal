<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade-In Evaluation — Motor Home Specialist</title>
<script>if(sessionStorage.getItem('iadRole')!=='service')location.replace('./');</script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14273F; --navy-deep:#0D1B2E; --paper:#FAF7F0;
    --gold:#C6A24E; --gold-soft:#F3E8CD; --ink:#1B2430;
    --muted:#6B7480; --line:#C9CDD4; --green:#2E7D4F; --red:#B3402F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Barlow',sans-serif;color:var(--ink);
    background:var(--navy);
    background-image:radial-gradient(1200px 500px at 50% -10%, #1E3A5C 0%, var(--navy) 55%, var(--navy-deep) 100%);
    min-height:100vh;padding:28px 14px 64px;
  }
  .sheet{max-width:980px;margin:0 auto;background:var(--paper);border-radius:6px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden}
  .mast{background:var(--navy);color:#fff;padding:22px 28px 18px;border-bottom:4px solid var(--gold)}
  .mast-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .brand img{height:44px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
  h1{font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;
    font-size:clamp(28px,5vw,42px);letter-spacing:.02em;line-height:1;
    color:var(--gold);text-transform:uppercase}
  h1 span{color:#fff}
  .mast small{display:block;font:600 11px/1.4 'Barlow Semi Condensed',sans-serif;
    letter-spacing:.14em;text-transform:uppercase;color:#B8C4D4;margin-top:4px}
  .signout{background:none;border:1px solid #3A5578;color:#B8C4D4;font:600 11px 'Barlow',sans-serif;
    letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:4px;cursor:pointer;margin-top:8px}
  .signout:hover{color:#fff;border-color:var(--gold)}
  .signout + .signout{margin-left:8px}
  .signout.armed{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
  .signout.armed:hover{border-color:var(--red)}

  /* ---------- Stepper ---------- */
  .stepper{display:flex;gap:6px;padding:14px 22px;background:var(--gold-soft);
    border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .stepper button{
    flex:1 0 auto;display:flex;align-items:center;gap:7px;white-space:nowrap;
    background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:7px 14px;cursor:pointer;font:600 13px 'Barlow',sans-serif;color:var(--muted);
  }
  .stepper button .n{display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;background:var(--line);color:#fff;
    font:700 11px 'Barlow Semi Condensed',sans-serif}
  .stepper button.active{border-color:var(--navy);color:var(--navy)}
  .stepper button.active .n{background:var(--navy);color:var(--gold)}
  .stepper button.done .n{background:var(--green)}

  /* ---------- Steps & fields ---------- */
  .step{display:none;padding:24px 26px 30px}
  .step.on{display:block}
  h2.sec{font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:22px;
    text-transform:uppercase;letter-spacing:.04em;color:var(--navy);
    border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:18px}
  h3.sub{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:15px;
    text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin:20px 0 10px}
  h3.sub:first-of-type{margin-top:0}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px 20px}
  .field label{display:block;font:700 11px 'Barlow',sans-serif;letter-spacing:.08em;
    text-transform:uppercase;color:var(--navy);margin-bottom:4px}
  .field label .req{color:var(--red)}
  .field.missreq input,.field.missreq .seg,.field.missreq .tgrid,
  .field.missreq .photo-btn:not(.has-photo){
    outline:2px solid var(--red);outline-offset:1px;border-radius:4px}
  .field input[type=text],.field input[type=date],.field textarea{
    width:100%;padding:9px 11px;font:inherit;font-size:15px;background:#fff;
    border:1px solid var(--line);border-radius:4px;color:var(--ink)}
  .field input[type=date]{min-height:41px;-webkit-appearance:none;appearance:none}
  .fnote{font:600 12px 'Barlow',sans-serif;color:var(--muted);margin-top:4px}
  .fnote.warn{color:var(--red)}
  .autonote{font:600 11px 'Barlow',sans-serif;color:var(--green);
    text-transform:none;letter-spacing:0;margin-left:8px}
  .sugwrap{position:relative}
  .suglist{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:40;background:#fff;
    border:1px solid var(--line);border-radius:4px;box-shadow:0 12px 28px rgba(0,0,0,.18);
    max-height:232px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sugitem{padding:12px;font-size:15px;cursor:pointer;border-bottom:1px solid #EFF1F4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sugitem:last-child{border-bottom:none}
  .sugitem:hover,.sugitem.sel{background:var(--gold-soft)}
  .pgroup{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:9px}
  .diag .pgroup{justify-content:center}
  .pgslot .pgroup{justify-content:flex-start}
  .field textarea{overflow:hidden}
  .tgraph{display:grid;grid-template-columns:1fr 108px 1fr;max-width:560px;margin:8px auto 0}
  .tcell{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:16px 0}
  .tleft{align-items:flex-end;padding-right:22px}
  .tright{align-items:flex-start;padding-left:22px}
  .tbody{position:relative;background:#E2E4E6;border:1px solid #BFC3C7;border-top:none;border-bottom:none;min-height:104px}
  .tbody.tfirst{border-top:1px solid #BFC3C7;border-radius:44px 44px 0 0;min-height:130px}
  .tbody.tlast{border-bottom:1px solid #BFC3C7;border-radius:0 0 16px 16px}
  .tbody.tspacer{min-height:150px}
  .tbody.tax{min-height:56px}
  .tcell.taxc{padding-top:5px;padding-bottom:5px}
  .tfront{position:absolute;top:14px;left:0;right:0;text-align:center;
    font:700 10px 'Barlow',sans-serif;letter-spacing:.12em;color:var(--muted)}
  .tire{position:absolute;top:50%;transform:translateY(-50%);width:16px;height:36px;
    background:#9EA3A8;border-radius:5px}
  .tire.tl{left:-9px}   .tire.tl.inner{left:11px}
  .tire.tr{right:-9px}  .tire.tr.inner{right:11px}
  .tire.has{background:var(--green)}
  .tire.ph{box-shadow:0 0 0 3px var(--gold)}
  .tin{display:flex;flex-direction:column;gap:3px}
  .tleft .tin{align-items:flex-end}
  .tright .tin{align-items:flex-start}
  .tcap{font:700 10px 'Barlow',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
  .tinrow{display:flex;gap:6px;align-items:center}
  .tgraph .tinrow input{width:76px;padding:8px 9px;font:inherit;font-size:15px;background:#fff;
    border:1px solid var(--line);border-radius:4px}
  .tgraph .tinrow input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  .tinrow .photo-btn{margin-top:0;padding:7px 9px}
  @media (max-width:560px){
    .tgraph{grid-template-columns:1fr 78px 1fr}
    .tleft{padding-right:18px}
    .tright{padding-left:18px}
    .tinrow{gap:4px}
    .tgraph .tinrow input{width:60px;font-size:14px;padding:7px 6px}
    .tinrow .photo-btn{padding:6px 6px}
    .tire{width:13px;height:30px}
    .tire.tl{left:-7px}  .tire.tl.inner{left:9px}
    .tire.tr{right:-7px} .tire.tr.inner{right:9px}
  }
  .sigpad{background:#fff;border:1px solid var(--line);border-radius:4px;max-width:600px}
  .sigpad canvas{width:100%;height:160px;display:block;touch-action:none;cursor:crosshair}
  .wsblock{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  .wsblock .wsseg{justify-content:center;margin-bottom:4px}
  .wsblock .wsdmg{margin-top:8px}
  .field input:focus,.field textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  .field textarea{min-height:64px;resize:vertical}
  .field.wide{grid-column:1/-1}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{
    padding:8px 13px;min-width:42px;cursor:pointer;background:#fff;
    border:1px solid var(--line);border-radius:4px;
    font:600 14px 'Barlow',sans-serif;color:var(--ink)}
  .seg button.on{background:var(--navy);border-color:var(--navy);color:var(--gold);font-weight:700}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}

  /* ---------- Vehicle-type icon grid ---------- */
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
  .tgrid button{display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:9px 6px 8px;background:#fff;border:1px solid var(--line);border-radius:6px;
    cursor:pointer;font:600 12px 'Barlow',sans-serif;color:var(--ink);text-align:center}
  .tgrid button img{width:100%;height:44px;object-fit:contain}
  .tgrid button:hover{border-color:var(--gold)}
  .tgrid button.on{border-color:var(--gold);background:var(--gold-soft);
    box-shadow:0 0 0 2px var(--gold) inset;color:var(--navy);font-weight:700}

  /* ---------- Photo buttons ---------- */
  .photo-btn{display:inline-flex;align-items:center;gap:5px;margin-top:7px;
    padding:7px 12px;cursor:pointer;background:#fff;border:1px dashed var(--gold);
    border-radius:4px;font:600 12px 'Barlow',sans-serif;color:#8A6D2A}
  .photo-btn.has-photo{border-style:solid;border-color:var(--green);color:var(--green);background:#EDF5EF}
  .photo-btn:disabled{opacity:.6}

  /* ---------- Damage step ---------- */
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
  .legend button{display:flex;align-items:center;gap:6px;padding:8px 12px;cursor:pointer;
    background:#fff;border:1px solid var(--line);border-radius:4px;font:600 13px 'Barlow',sans-serif}
  .legend button b{display:inline-flex;align-items:center;justify-content:center;
    min-width:22px;height:22px;padding:0 3px;border-radius:50%;
    background:var(--gold-soft);color:var(--navy);font:700 11px 'Barlow Semi Condensed',sans-serif}
  .legend button.on{background:var(--navy);border-color:var(--navy);color:var(--gold)}
  .legend button.on b{background:var(--gold);color:var(--navy)}
  .diag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}
  .diag{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}
  .diag.roofcard{grid-column:1/-1}
  .diag h4{font:700 12px 'Barlow',sans-serif;letter-spacing:.1em;text-transform:uppercase;
    color:var(--navy);text-align:center;margin-bottom:6px}
  .diag svg{width:100%;height:auto;display:block;touch-action:manipulation;color:#22344E;max-height:190px;margin:0 auto}
  .diag.roofcard svg{max-width:560px}
  .diag svg .cut{stroke:#FAF7F0;fill:none}
  .diag svg .cutfill{fill:#FAF7F0}
  .diag svg .mk circle{fill:var(--gold);stroke:var(--navy);stroke-width:1}
  .diag svg .mk text{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;fill:var(--navy);
    text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .dmg-tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .dmg-tools button{padding:8px 14px;cursor:pointer;background:#fff;border:1px solid var(--line);
    border-radius:4px;font:600 13px 'Barlow',sans-serif;color:var(--ink)}

  /* ---------- Nav & buttons ---------- */
  .stepnav{display:flex;justify-content:space-between;gap:10px;padding:0 26px 28px}
  .btn{padding:12px 26px;cursor:pointer;border-radius:4px;border:none;
    font:700 16px 'Barlow Semi Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em}
  .btn.primary{background:var(--navy);color:var(--gold)}
  .btn.primary:hover{background:var(--navy-deep)}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.danger{background:#fff;border:1px solid var(--red);color:var(--red)}

  /* ---------- Review ---------- */
  .rev-note{background:var(--gold-soft);border-left:4px solid var(--gold);
    padding:12px 14px;font-size:14px;border-radius:0 4px 4px 0;margin-bottom:18px}
  .missing{font-size:14px;margin:14px 0;color:var(--red);font-weight:600}

  /* ---------- Print sheet ---------- */
  #printSheet{display:none}
  @media print{
    body{background:#fff;padding:0}
    body > *:not(#printSheet){display:none !important}
    #printSheet{display:block;font-family:'Barlow',sans-serif;color:#000}
    @page{size:letter;margin:0.35in}
    #printSheet .p-head{display:flex;justify-content:space-between;align-items:baseline;
      border-bottom:3px solid #000;padding-bottom:4px;margin-bottom:8px}
    #printSheet .p-head h1{font:800 20px 'Barlow Semi Condensed',sans-serif;color:#000;text-transform:uppercase}
    #printSheet .p-head span{font:600 10px 'Barlow',sans-serif}
    #printSheet h2{font:800 12px 'Barlow Semi Condensed',sans-serif;text-transform:uppercase;
      letter-spacing:.06em;border-bottom:1.5px solid #000;margin:8px 0 4px;padding-bottom:1px;
      break-after:avoid}
    #printSheet .cols{columns:3;column-gap:16px}
    #printSheet .pf{display:block;font-size:9.5px;line-height:1.75;break-inside:avoid;
      border-bottom:0.5px dotted #999}
    #printSheet .pf b{font-weight:700}
    #printSheet .pline{font-size:9.5px;line-height:1.7;margin-top:2px}
    #printSheet .pline b{font-weight:700}
    #printSheet .p-dmg{break-before:page}
    #printSheet .p-diags{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
    #printSheet .p-diag{border:1px solid #000;padding:4px;text-align:center}
    #printSheet .p-diag.roofcard{grid-column:1/-1}
    #printSheet .p-diag h4{font:700 9px 'Barlow',sans-serif;text-transform:uppercase;letter-spacing:.08em}
    #printSheet .p-diag svg{width:100%;max-height:2.2in;color:#000}
    #printSheet .p-diag.roofcard svg{max-height:1.8in}
    #printSheet .p-diag svg .cut{stroke:#fff;fill:none}
    #printSheet .p-diag svg .cutfill{fill:#fff}
    #printSheet .p-diag svg .mk circle{fill:#fff;stroke:#000;stroke-width:1}
    #printSheet .p-diag svg .mk text{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;fill:#000;
      text-anchor:middle;dominant-baseline:central}
    #printSheet .p-photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
    #printSheet .p-ph{border:1px solid #000;padding:4px;text-align:center;break-inside:avoid}
    #printSheet .p-ph h4{font:700 9px 'Barlow',sans-serif;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
    #printSheet .p-ph img{max-width:100%;max-height:3.1in}
    #printSheet .sig-row{display:flex;gap:24px;margin-top:22px;align-items:flex-end}
    #printSheet .sigcell{flex:1}
    #printSheet .sigcell .sigimg{display:block;max-height:0.55in;margin:0 auto 2px}
    #printSheet .sig{border-top:1px solid #000;font:700 10px 'Barlow',sans-serif;
      text-transform:uppercase;padding-top:3px}
    #printSheet .p-foot{font-size:8px;text-align:right;margin-top:10px;color:#555}
  }

  @media(max-width:640px){
    body{padding:12px 6px 40px}
    .step{padding:18px 14px 24px}
    .stepnav{padding:0 14px 22px}
    .fgrid{grid-template-columns:1fr 1fr}
    .field.wide{grid-column:1/-1}
    .tgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  }
</style>
</head>
<body>

<div class="sheet">
  <header class="mast">
    <div class="mast-top">
      <div class="brand">
        <img src="https://mhsrv.s3.amazonaws.com/images/homeimage/logo--mhs-bc.png" alt="Motor Home Specialist">
      </div>
      <div style="text-align:right">
        <h1>Trade-In <span>Evaluation</span></h1>
        <small>Motor Home Specialist &middot; Alvarado, TX</small>
        <button type="button" class="signout" id="clearStart">&#8635; Clear &amp; Start Over</button>
        <button type="button" class="signout" id="signOut">Sign Out</button>
      </div>
    </div>
  </header>

  <nav class="stepper" id="stepper"></nav>
  <div id="steps"></div>

  <div class="stepnav">
    <button type="button" class="btn ghost" id="backBtn">&larr; Back</button>
    <button type="button" class="btn primary" id="nextBtn">Next &rarr;</button>
  </div>
</div>

<div id="printSheet"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var YN = ['Y','N'];

/* ============================================================
   Type artwork — pickers use img/types/*.webp side renders;
   the 5 body-damage views use img/types/views/<base>_<view>.webp,
   sliced from the orthographic sheets (passenger / driver /
   front / rear / roof per type). vd = native w,h of each crop.
   ============================================================ */
var TYPES = [
  {n:'Class A Gas',    img:'class_a.webp',        base:'class_a',        roofFront:'left',
   vd:{passenger:[900,286], driver:[900,297], front:[322,316], rear:[261,325], roof:[881,178]}},
  {n:'Class C & B+',   img:'class_c.webp',        base:'class_c',        roofFront:'right',
   vd:{passenger:[824,359], driver:[755,350], front:[298,350], rear:[296,344], roof:[707,257]}},
  {n:'Class B / Van',  img:'class_b.webp',        base:'class_b',        roofFront:'left',
   vd:{passenger:[762,314], driver:[765,315], front:[344,357], rear:[290,362], roof:[800,305]}},
  {n:'Diesel Pusher',  img:'diesel_pusher.webp',  base:'diesel_pusher',  roofFront:'right',
   vd:{passenger:[804,233], driver:[792,234], front:[331,317], rear:[297,316], roof:[790,280]}},
  {n:'Super C',        img:'super_c.webp',        base:'super_c',        roofFront:'right',
   vd:{passenger:[852,307], driver:[801,308], front:[338,375], rear:[299,375], roof:[800,274]}},
  {n:'5th Wheel',      img:'fifth_wheel.webp',    base:'fifth_wheel',    roofFront:'right',
   vd:{passenger:[827,275], driver:[827,275], front:[301,360], rear:[323,360], roof:[836,275]}},
  {n:'Toy Hauler',     img:'toy_hauler.webp',     base:'toy_hauler',     roofFront:'right',
   vd:{passenger:[900,267], driver:[900,257], front:[302,300], rear:[274,302], roof:[900,198]}},
  {n:'Travel Trailer', img:'travel_trailer.webp', base:'travel_trailer', roofFront:'right',
   vd:{passenger:[726,276], driver:[665,277], front:[293,366], rear:[319,354], roof:[669,280]}}
];
var TYPE_NAMES = TYPES.map(function(t){ return t.n; });

/* Manufacturer & Brand suggestions — every Brand+Model line in the
   MHSRV NetSource inventory export, merged with an industry-wide
   manufacturer/brand-line dataset (campaddict.com RV manufacturer
   directory + curated lineups) so trades outside our inventory

/* ---- The 5 orthographic views per type, all normalized to a
        180-unit-tall viewBox so marker size stays consistent ---- */
function viewsFor(t){
  var order = [
    {v:'front',     l:'Front',          mr:12},
    {v:'driver',    l:'Driver Side',    mr:14},
    {v:'passenger', l:'Passenger Side', mr:14},
    {v:'rear',      l:'Back',           mr:12},
    {v:'roof',      l:'Roof (front at '+t.roofFront+')', mr:14, roof:true}
  ];
  return order.map(function(o){
    var d = t.vd[o.v];
    var w = Math.round(d[0]*180/d[1]);
    return {v:o.v, l:o.l, vb:'0 0 '+w+' 180', mr:o.mr, roof:o.roof,
      art:'<image href="img/types/views/'+t.base+'_'+o.v+'.webp" x="0" y="0" width="'+w+'" height="180"/>'};
  });
}

/* ============================================================
   VIN -> Class decode. Chassis WMI (first 3 chars) plus body
   codes identify the platform; towables carry a body-type char
   right after the WMI. Returns null rather than guessing — and
   toy haulers can't be told apart from their donor body, so the
   tech relabels those on visual inspection.
   ============================================================ */
function classFromVIN(vin){
  if(!vin || vin.length < 8) return null;
  var w = vin.slice(0,3), d = vin.charAt(3), vds = vin.slice(3,8);
  var TT='Travel Trailer', FW='5th Wheel', A='Class A Gas',
      C='Class C & B+', B='Class B / Van', DP='Diesel Pusher', SC='Super C';
  if(w==='1F6') return A;                                   // Ford F-53 stripped chassis
  if(w==='4VZ') return DP;                                  // Spartan
  if(w==='1FV') return SC;                                  // Freightliner M2 / S2RV
  if(w==='1HT') return SC;                                  // International
  if(w==='3C7') return SC;                                  // Ram 4500/5500 chassis cab
  if(w==='3C6') return B;                                   // Ram ProMaster
  if(w==='4UZ'){                                            // Freightliner Custom Chassis
    if(vds.indexOf('ADV')===0) return SC;                   // M2 106 conventional
    if(vds.charAt(1)==='C') return DP;                      // XC pusher rail
    return null;
  }
  if(w==='1FD'){                                            // Ford incomplete
    if(vds.charAt(1)==='E') return C;                       // E-350/E-450 cutaway
    if(vds.slice(0,3).indexOf('F6')>-1) return SC;          // F-650 ('FF6','PF6')
    if(vds.indexOf('RU8')===0) return vin.charAt(6)==='U' ? B : C;  // Transit van vs cutaway
    return null;
  }
  if(w==='1HA'||w==='1GB') return vin.charAt(4)==='G' ? C : null;   // GM Express cutaway
  if(/^W1[VWXYZ]/.test(w)) return /\d/.test(vin.charAt(5)) ? C : B; // Sprinter: digit = cab-chassis
  if(w==='WDA') return C;                                   // older Sprinter chassis
  if(w==='WDB'||w==='WD3'||w==='WD4') return vds.indexOf('PF')===0 ? C : B;
  if(w==='5KE') return FW;                                  // dealer-confirmed
  if(w==='5RX') return TT;                                  // dealer-confirmed
  var TOW = {'4X4':1,'4YD':1,'573':1,'7M5':1,'4V0':1,'47C':1,'4EZ':1,'5SF':1,'1UJ':1,'5ZT':1};
  if(TOW[w]){
    if(d==='T'||d==='B'||d==='2') return TT;
    if(d==='F'||d==='C'||d==='3') return FW;
    return null;
  }
  return null;
}

/* ============================================================
   NHTSA vPIC auto-fill. Free CORS API; on a full 17-char VIN we
   fill fields we're CERTAIN about, and only when the field is
   empty or was auto-filled before — a tech's entry always wins.
   Towables get Year too; motorized never does (chassis year can
   differ from the coach's model year).
   ============================================================ */
function markAuto(id){
  var lbl = document.querySelector('[data-fw="'+id+'"] label');
  if(!lbl || lbl.querySelector('.autonote')) return;
  var n = document.createElement('span');
  n.className = 'autonote'; n.textContent = '✨ inputted automagically';
  lbl.appendChild(n);
}
function unmarkAuto(id){
  var n = document.querySelector('[data-fw="'+id+'"] label .autonote');
  if(n) n.remove();
}
function clearAutoFlag(id){
  if(state.autoFill && state.autoFill[id]){ delete state.autoFill[id]; unmarkAuto(id); }
}
/* Transmission knowledge base, keyed by the decoded chassis. Only
   combos that ship one way — when in doubt, we fill nothing. */
function transFor(make, model, disp){
  var m = model.toUpperCase();
  if(make==='FORD'){
    if(disp===7.3 && (m.indexOf('MOTORHOME')>-1 || m==='E-350' || m==='E-450')) return {m:'Ford', s:'6 Speed'};
    if(m==='TRANSIT') return {m:'Ford', s:'10 Speed'};
    if(m==='F-600') return {m:'Ford', s:'10 Speed'};
    if(m==='F-650' || m==='F-750') return {m:'Ford', s:'6 Speed'};
    return null;
  }
  if(make==='CHEVROLET' && m==='EXPRESS' && disp===6.6) return {m:'Chevy', s:'6 Speed'};
  if(make==='MERCEDES-BENZ' && m==='SPRINTER' && disp===2) return {m:'Other', mo:'Mercedes-Benz', s:'Other', so:'9 Speed'};
  if(make==='RAM'){
    if(m.indexOf('PROMASTER')===0) return {m:'Other', mo:'ZF', s:'Other', so:'9 Speed'};
    if((m==='4500'||m==='5500') && disp===6.7) return {m:'Other', mo:'Aisin', s:'6 Speed'};
    return null;
  }
  if(make==='FREIGHTLINER'){
    if(m.indexOf('CASCADIA')>-1) return null;   // DT12 vs Allison varies
    return {m:'Allison', s:'6 Speed'};          // XC / S2RV / M2: Allison only
  }
  if(make.indexOf('SPARTAN')===0) return {m:'Allison', s:'6 Speed'};
  if(make==='INTERNATIONAL') return {m:'Allison', s:'6 Speed'};
  return null;
}
var BRAND_NOISE = {recreational:1, vehicles:1, vehicle:1, rv:1, towable:1, towables:1,
                   inc:1, llc:1, corp:1, industries:1, motorhomes:1};
function sigWords(s){
  return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/)
          .filter(function(w){ return w && !BRAND_NOISE[w]; });
}
function matchBrand(combined){
  var comb = sigWords(combined);
  var best = null, bestLen = 0, reverse = [];
  MFG_BRANDS.forEach(function(n){
    var w = sigWords(n);
    var fwd = w.every(function(t){ return comb.indexOf(t)>-1; });
    if(fwd && w.length > bestLen){ best = n; bestLen = w.length; return; }
    var rev = comb.every(function(t){ return w.indexOf(t)>-1; });
    if(rev) reverse.push(n);
  });
  if(best) return best;
  return reverse.length===1 ? reverse[0] : null;
}
function titleCase(s){
  return s.toLowerCase().replace(/\b[a-z]/g, function(c){ return c.toUpperCase(); });
}
function applyVpic(res){
  state.autoFill = state.autoFill || {};
  var filled = [];
  function g(k){ return (res[k]||'').trim(); }
  function put(id, val){
    if(!val) return;
    var cur = (state.v[id]||'').trim();
    if(cur && !state.autoFill[id]) return;
    if(cur!==val){ state.v[id] = val; filled.push(id); }
    state.autoFill[id] = 1;
  }
  var make = g('Make').toUpperCase();
  var model = g('Model');
  var disp = parseFloat(g('DisplacementL')) || 0;
  var isTrailer = g('BodyClass')==='Trailer' || g('VehicleType').indexOf('TRAILER')===0;
  /* a corrected VIN can flip towable <-> motorized: drop auto-fills that
     only the other branch writes, so nothing stale lingers */
  var wiped = false;
  (isTrailer ? ['fuelType','engineMfg','engineHp','chassisMfg','transMfg','transMfgOther','transSpeed','transSpeedOther','fourX4']
             : ['yr','make','length']).forEach(function(id){
    if(state.autoFill[id]){
      delete state.autoFill[id];
      if(state.v[id]){ state.v[id] = ''; wiped = true; }
      unmarkAuto(id);
    }
  });
  if(isTrailer){
    if(/^\d{4}$/.test(g('ModelYear'))) put('yr', g('ModelYear'));
    var L = parseFloat(g('TrailerLength'));
    if(L) put('length', String(Math.round(L)));
    var comb = make.replace(/\//g,' ');
    var mdl = model.replace(/\s*Towables?$/i,'').trim();
    if(mdl && comb.toLowerCase().indexOf(mdl.toLowerCase())<0) comb += ' ' + mdl;
    put('make', matchBrand(comb) || titleCase(sigWords(comb).join(' ')));
    var tt = g('TrailerType').toLowerCase();
    if(/fifth|gooseneck/.test(tt)) setAutoClass('5th Wheel');
    else if(/ball|bumper|pull/.test(tt)) setAutoClass('Travel Trailer');
  }else{
    var fuel = g('FuelTypePrimary');
    if(fuel==='Gasoline') put('fuelType','Gas');
    else if(fuel==='Diesel') put('fuelType','Diesel');
    else if(fuel==='Electric') put('fuelType','Electric');
    var em = g('EngineManufacturer'), emL = em.toLowerCase();
    if(emL.indexOf('cummins')>-1) em = 'Cummins';
    else if(emL==='gm') em = 'GM';
    else if(emL.indexOf('detroit')>-1) em = 'Detroit Diesel';
    else if(emL==='fca' || emL==='stla') em = 'Stellantis';
    else if(emL==='ford') em = 'Ford';
    if(!em && make==='MERCEDES-BENZ') em = 'Mercedes-Benz';
    /* engine size folds into the manufacturer field: "6.7L Cummins" */
    var dispStr = disp ? ((disp % 1 === 0 ? disp.toFixed(1) : String(disp)) + 'L') : '';
    put('engineMfg', (dispStr && em) ? dispStr+' '+em : (em || dispStr));
    if(g('EngineHP')) put('engineHp', g('EngineHP')+' HP');
    var CM = {FORD:'Ford', CHEVROLET:'Chevrolet', 'MERCEDES-BENZ':'Mercedes', RAM:'RAM',
              FREIGHTLINER:'Freightliner', INTERNATIONAL:'International',
              PREVOST:'Prevost', NEWELL:'Newell'};
    var cm = CM[make] || (make.indexOf('SPARTAN')===0 ? 'Spartan'
             : make.indexOf('TIFFIN')===0 ? 'Tiffin PowerGlide' : '');
    put('chassisMfg', cm);
    var dt = g('DriveType').toLowerCase();
    if(/4wd|4x4/.test(dt)) put('fourX4','Y');
    else if(/4x2|6x2|6x4|rwd|fwd/.test(dt)) put('fourX4','N');
    var tr = transFor(make, model, disp);
    if(tr){
      put('transMfg', tr.m);
      if(tr.mo) put('transMfgOther', tr.mo);
      put('transSpeed', tr.s);
      if(tr.so) put('transSpeedOther', tr.so);
    }
  }
  if(filled.length || wiped){
    save(); restoreInputs();
    filled.forEach(markAuto);
    refreshUnitMissing();
    var vinEl = document.querySelector('[data-f="vin"]');
    if(vinEl) setFieldNote(vinEl, '✓ 17 characters · ✨ '+filled.length+' field'+(filled.length>1?'s':'')+' inputted automagically (NHTSA)', false);
  }
}
var vpicLast = '';
function vinAutoFill(vin){
  if(vin.length!==17 || vin===vpicLast || !window.fetch) return;
  vpicLast = vin;
  var ctrl = window.AbortController ? new AbortController() : null;
  var to = ctrl ? setTimeout(function(){ ctrl.abort(); }, 8000) : null;
  fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+encodeURIComponent(vin)+'?format=json',
        ctrl ? {signal: ctrl.signal} : {})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(to) clearTimeout(to);
      var res = j && j.Results && j.Results[0];
      if(res && vin===(state.v.vin||'').trim()) applyVpic(res);
    })

/* ============================================================
   Photos (same pipeline as the deal sheet: <=1600px JPEG 0.82)
   ============================================================ */
async function decodePhotoToCanvas(file, MAX){
  var src = null, w = 0, h = 0;
  if(window.createImageBitmap){
    try{ src = await createImageBitmap(file, {imageOrientation:'from-image'}); }
    catch(e){ try{ src = await createImageBitmap(file); }catch(e2){} }
  }
  if(src){ w = src.width; h = src.height; }
  else{
    src = await new Promise(function(resolve,reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ reject(new Error('unreadable image')); };
      img.src = URL.createObjectURL(file);
    });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  var k = Math.min(1, MAX / Math.max(w, h));
  var c = document.createElement('canvas');
  c.width = Math.round(w*k); c.height = Math.round(h*k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}
var photoInput = $('photoInput');
var pendingPhoto = null;
function startPhoto(key){ pendingPhoto = key; photoInput.click(); }
photoInput.addEventListener('change', async function(){
  var file = photoInput.files && photoInput.files[0];
  photoInput.value = '';
  var key = pendingPhoto; pendingPhoto = null;
  if(!file || !key) return;
  var btns = document.querySelectorAll('button[data-photo="'+key+'"]');
  Array.prototype.forEach.call(btns, function(b){ b.disabled=true; b.textContent='Processing…'; });
  try{
    var c = await decodePhotoToCanvas(file, 1600);
    photos[key] = {data: c.toDataURL('image/jpeg', 0.82), w: c.width, h: c.height};
    savePhotos();
  }catch(err){
    alert('Could not read that photo — please try again.');
  }finally{
    Array.prototype.forEach.call(btns, function(b){ b.disabled=false; });
    if(key.indexOf('dmg|')===0 || key.indexOf('wsGood|')===0) renderDiagrams();
    if(key.indexOf('tire|')===0) renderTireWidget();
    renderPhotoGroupSlots();
    refreshPhotoBtns();
  }
});

       First button reads "Take Photo of <label>"; once one exists, each
       becomes "✓ <label> n (tap to retake)" plus a "+ Add Photo". ---- */
function groupKeys(base){
  return Object.keys(photos).filter(function(k){ return k.indexOf(base+'|')===0; })
    .sort(function(a,b){ return (+a.slice(base.length+1)) - (+b.slice(base.length+1)); });

  });
  if(keys.length){

    h += '<button type="button" class="photo-btn" data-photo="'+base+'|'+next+'">&#65291; Add Photo</button>';
  }else{
    h += '<button type="button" class="photo-btn" data-photo="'+base+'|0">&#128247; Take Photo of '+label+'</button>';

/* ============================================================
   Tire date-code widget: top-down diagram of the Class picked on
   Unit Info, one row per tire (date code + photo). TT / 5th
   Wheel / Super C / Diesel Pusher can add a rear axle.
   ============================================================ */
var TIRE_LABELS = {
  LF:'Left Front', RF:'Right Front', LR:'Left Rear', RR:'Right Rear',
  LRO:'Left Rear Outer', LRI:'Left Rear Inner', RRI:'Right Rear Inner', RRO:'Right Rear Outer',
  LT:'Left Tag', RT:'Right Tag',
  A1L:'Axle 1 Left', A1R:'Axle 1 Right', A2L:'Axle 2 Left', A2R:'Axle 2 Right',
  A3L:'Axle 3 Left', A3R:'Axle 3 Right'
};
var EXTRA_AXLE_OK = {'Super C':1, 'Diesel Pusher':1};
/* Towables (TT / 5th Wheel) start with a single rear axle; extra axles
   are added in FRONT of the rear axle, up to 3 total. */
function towAxleCt(){
  var n = parseInt(state.v.tireAxleCt, 10);
  if(n>=1 && n<=3) return n;
  if(state.v.tireExtraAxle==='Y') return 3;
  if((state.v.tireDC_A2L||'') || (state.v.tireDC_A2R||'') || photos['tire|A2L'] || photos['tire|A2R']) return 2;
  return 1;
}
function tireLayout(){
  var cls = (state.v.unitClass||'').trim();
  if(TYPE_NAMES.indexOf(cls)<0) return null;
  var extra = state.v.tireExtraAxle==='Y' && EXTRA_AXLE_OK[cls];
  if(cls==='Class B / Van') return {cls:cls, towable:false, pos:['LF','RF','LR','RR']};
  if(cls==='Travel Trailer' || cls==='5th Wheel'){
    var n = towAxleCt(), p = [];
    for(var i=1;i<=n;i++){ p.push('A'+i+'L','A'+i+'R'); }
    return {cls:cls, towable:true, axleCt:n, pos:p};
  }
  var p2 = ['LF','RF','LRO','LRI','RRI','RRO'];
  if(extra) p2.push('LT','RT');
  return {cls:cls, towable:false, pos:p2};
}
function tireCode(pos){ return (state.v['tireDC_'+pos]||'').trim(); }
function tireSummary(lay){
  var parts = [];
  lay.pos.forEach(function(p){ if(tireCode(p)) parts.push(p+' '+tireCode(p)); });
  return parts.join(' · ');
}
function tireAxles(lay){
  if(lay.towable){
    var ax = [];
    for(var i=1;i<=lay.axleCt;i++) ax.push({l:['A'+i+'L'], r:['A'+i+'R']});
    return ax;
  }
  if(lay.cls==='Class B / Van') return [{l:['LF'], r:['RF']}, {l:['LR'], r:['RR']}];
  var ax2 = [{l:['LF'], r:['RF']}, {l:['LRO','LRI'], r:['RRI','RRO']}];
  if(lay.pos.indexOf('LT')>-1) ax2.push({l:['LT'], r:['RT']});
  return ax2;
}
function tireShortLabel(p){
  return TIRE_LABELS[p].replace(/^Left |^Right /,'').replace(/ Left$| Right$/,'');
}
function tireInputHTML(p){
  var ph = !!photos['tire|'+p];
  return '<div class="tin">'+
    '<span class="tcap">'+tireShortLabel(p)+'</span>'+
    '<div class="tinrow">'+
    '<input type="text" inputmode="numeric" data-tire="'+p+'" placeholder="WWYY" maxlength="4" value="'+tireCode(p).replace(/"/g,'&quot;')+'" autocomplete="off" aria-label="'+TIRE_LABELS[p]+' date code">'+
    '<button type="button" class="photo-btn'+(ph?' has-photo':'')+'" data-photo="tire|'+p+'" title="'+TIRE_LABELS[p]+' photo">'+(ph?'&#10003;':'&#128247;')+'</button>'+
    '</div></div>';
}
function tireMarkHTML(p, side, idx){
  var code = tireCode(p), ph = !!photos['tire|'+p];
  return '<span class="tire '+side+(idx===1?' inner':'')+(code?' has':'')+(ph?' ph':'')+'" id="tw_'+p+'"></span>';
}
function renderTireWidget(){
  var el = $('tireWidget');
  if(!el) return;
  var lay = tireLayout();
  if(!lay){
    el.innerHTML = '<p class="hint">&#9888; Pick the <b>Class</b> on Step 1 &mdash; Unit Info and the tire layout will load here.</p>';
    return;
  }
  var axles = tireAxles(lay);
  var h = '<div class="tgraph">';
  if(lay.towable){
    /* long front body section — trailers have no front axle */
    h += '<div class="tcell tleft"></div>'+
         '<div class="tbody tfirst tspacer"><span class="tfront">FRONT</span></div>'+
         '<div class="tcell tright"></div>';
  }
  var cellCls = lay.towable ? ' taxc' : '';
  axles.forEach(function(ax, i){
    var bodyCls = 'tbody' + (lay.towable ? ' tax' : (i===0 ? ' tfirst' : '')) + (i===axles.length-1 ? ' tlast' : '');
    h += '<div class="tcell tleft'+cellCls+'">' + ax.l.map(tireInputHTML).join('') + '</div>';
    h += '<div class="'+bodyCls+'">' + (!lay.towable && i===0 ? '<span class="tfront">FRONT</span>' : '');
    ax.l.forEach(function(p, j){ h += tireMarkHTML(p, 'tl', j); });
    ax.r.forEach(function(p, j){ h += tireMarkHTML(p, 'tr', j); });
    h += '</div>';
    h += '<div class="tcell tright'+cellCls+'">' + ax.r.map(tireInputHTML).join('') + '</div>';
  });
  h += '</div>';
  if(lay.towable){
    h += '<div style="text-align:center">';
    if(lay.axleCt<3)
      h += '<button type="button" class="photo-btn" id="towAxleAdd" style="margin-top:10px">&#65291; Add Axle</button>';
    if(lay.axleCt>1)
      h += ' <button type="button" class="photo-btn" id="towAxleRem" style="margin-top:10px">&#8722; Remove Axle</button>';
    h += '</div>';
  } else if(EXTRA_AXLE_OK[lay.cls]){
    var on = state.v.tireExtraAxle==='Y';
    h += '<div style="text-align:center"><button type="button" class="photo-btn" id="tireAxleBtn" style="margin-top:10px">'+
         (on ? '&#8722; Remove Added Axle' : '&#65291; Add Rear Axle') + '</button></div>';
  }
  el.innerHTML = h;
  var ab = $('tireAxleBtn');
  if(ab) ab.addEventListener('click', function(){
    state.v.tireExtraAxle = state.v.tireExtraAxle==='Y' ? '' : 'Y';
    tireRefresh();
  });
  var addB = $('towAxleAdd'), remB = $('towAxleRem');
  if(addB) addB.addEventListener('click', function(){ towAxleChange(1); });
  if(remB) remB.addEventListener('click', function(){ towAxleChange(-1); });
}
function tireRefresh(){
  var l2 = tireLayout();
  state.v.tireAge = l2 ? tireSummary(l2) : '';
  save(); savePhotos();
  renderTireWidget();
}
/* Shift one tire position's date code + photo to another slot. */
function tireMove(from, to){
  state.v['tireDC_'+to] = state.v['tireDC_'+from] || '';
  delete state.v['tireDC_'+from];
  if(photos['tire|'+from]){ photos['tire|'+to] = photos['tire|'+from]; delete photos['tire|'+from]; }
  else delete photos['tire|'+to];
}
/* Add (+1) inserts a fresh axle in FRONT of the rear axle — existing
   codes/photos slide back so they stay with the same physical tires.
   Remove (-1) drops the front-most added axle. */
function towAxleChange(d){
  var n = towAxleCt(), i;
  if(d>0 && n<3){
    for(i=n;i>=1;i--){ tireMove('A'+i+'L','A'+(i+1)+'L'); tireMove('A'+i+'R','A'+(i+1)+'R'); }
    state.v.tireAxleCt = n+1;
  } else if(d<0 && n>1){
    for(i=2;i<=n;i++){ tireMove('A'+i+'L','A'+(i-1)+'L'); tireMove('A'+i+'R','A'+(i-1)+'R'); }
    delete state.v['tireDC_A'+n+'L']; delete state.v['tireDC_A'+n+'R'];
    delete photos['tire|A'+n+'L']; delete photos['tire|A'+n+'R'];
    state.v.tireAxleCt = n-1;
  } else return;
  tireRefresh();
}

        h += '<span class="pf"><b>'+f.l+':</b> '+val+'</span>';
      });
    });
    h += '</div>';
  });
  var tn = TYPE_NAMES.indexOf(state.v.unitClass)>-1 ? state.v.unitClass : state.dmgType;
  var t = TYPES[TYPE_NAMES.indexOf(tn)];
  h += '<div class="p-dmg"><div class="p-head"><h1>'+esc(tn)+' Body Damage Notations</h1>'+
       '<span>Stock # '+pv('stock')+' &middot; Date: '+pv('dmgDate')+'</span></div>';
  h += '<div class="pline"><b>Legend:</b> '+LEGEND.map(function(x){ return x.c+' - '+x.n; }).join(' &nbsp; ')+'</div>';
  h += '<div class="p-diags">';
  viewsFor(t).forEach(function(spec){
    h += '<div class="p-diag'+(spec.roof?' roofcard':'')+'"><h4>'+spec.l+'</h4>'+svgFor(spec, state.mk[tn][spec.v], false)+'</div>';
  });
  h += '</div>';
  h += '<div class="pline"><b>Windshield Good:</b> '+pv('wsGood')+
       ' &nbsp;&nbsp; <b>Windshield Cracks / Stars:</b> '+pm('wsDmg')+'</div>';
  h += '<div class="pline"><b>Notes:</b> '+pv('dmgNotes')+'</div>';
  h += '<div class="pline"><b>Claim Mark:</b> '+pv('claimMark')+
       ' &nbsp;&nbsp; <b>Insurance Claim To Place:</b> '+pv('insClaim')+
       ' &nbsp;&nbsp; <b>Deductible Amount:</b> '+pv('deductible')+'</div>';
  h += '<h2>Additional Comments</h2><div class="pline">'+pv('comments')+'</div>';
  h += '<div class="sig-row">'+
       '<div class="sigcell">'+(photos.techSig ? '<img class="sigimg" src="'+photos.techSig.data+'">' : '')+
       '<div class="sig">Inspected By: '+pv('inspectedBy')+' &mdash; Technician Signature</div></div>'+
       '<div class="sigcell"><div class="sig">Sales Manager Signature &nbsp;&nbsp; Date: '+pv('salesDate')+'</div></div>'+
       '</div>';
  /* photos */
  var entries = [];
  Object.keys(PHOTO_LABELS).forEach(function(k){
    if(photos[k]) entries.push({label:PHOTO_LABELS[k], data:photos[k].data});
  });
  groupKeys('wsGood').forEach(function(k,i){
    entries.push({label:'Windshield Photo '+(i+1), data:photos[k].data});
  });
  Object.keys(photos).filter(function(k){ return k.indexOf('tire|')===0; }).sort().forEach(function(k){
    var p = k.slice(5);
    entries.push({label:'Tire — '+(TIRE_LABELS[p]||p)+' Photo', data:photos[k].data});
  });
  TYPE_NAMES.forEach(function(typeName){
    VIEW_IDS.forEach(function(v){
      groupKeys('dmg|'+typeName+'|'+v).forEach(function(k,i){
        entries.push({label:typeName+' — '+VIEW_LABELS[v]+' Photo '+(i+1), data:photos[k].data});
      });
    });
  });
  if(entries.length){
    h += '<h2 style="break-before:page">Photos</h2><div class="p-photos">';
    entries.forEach(function(en){
      h += '<div class="p-ph"><h4>'+esc(en.label)+'</h4><img src="'+en.data+'"></div>';
    });
    h += '</div>';
  }
  h += '<div class="p-foot">MHS Trade-In Evaluation &middot; mhsrv.app</div></div>';
  $('printSheet').innerHTML = h;
}

/* Technician finger-signature pad */
(function(){
  var c = $('sigCanvas');
  if(!c) return;
  var ctx = c.getContext('2d');
  ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14273F';
  var drawing = false, last = null;
  function pt(e){
    var r = c.getBoundingClientRect();
    return {x:(e.clientX - r.left) * (c.width / r.width),
            y:(e.clientY - r.top) * (c.height / r.height)};
  }
  c.addEventListener('pointerdown', function(e){
    e.preventDefault();
    if(c.setPointerCapture) c.setPointerCapture(e.pointerId);
    drawing = true; last = pt(e);
  });
  c.addEventListener('pointermove', function(e){
    if(!drawing) return;
    e.preventDefault();
    var p = pt(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  function done(){
    if(!drawing) return;
    drawing = false;
    photos.techSig = {data: c.toDataURL('image/png'), w: c.width, h: c.height};
    savePhotos();
  }
  c.addEventListener('pointerup', done);
  c.addEventListener('pointercancel', done);
  $('sigClear').addEventListener('click', function(){
    ctx.clearRect(0, 0, c.width, c.height);
    delete photos.techSig;
    savePhotos();
  });
  if(photos.techSig){
    var img = new Image();
    img.onload = function(){ ctx.drawImage(img, 0, 0); };
    img.src = photos.techSig.data;
  }
})();

/* Clear & Start Over — two taps: first arms it ("Are you sure? — YES"),
   second wipes the draft. Disarms after 5s or on any tap elsewhere. */
(function(){
  var btn = $('clearStart'), timer = null;
  function disarm(){
    btn.classList.remove('armed');
    btn.innerHTML = '&#8635; Clear &amp; Start Over';
    if(timer){ clearTimeout(timer); timer = null; }
  }
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if(!btn.classList.contains('armed')){
      btn.classList.add('armed');
      btn.textContent = 'Are you sure? — YES';
      timer = setTimeout(disarm, 5000);
      return;
    }
    localStorage.removeItem(DRAFT_KEY);
    localStorage.removeItem(PHOTO_KEY);
    location.reload();
  });
  document.addEventListener('click', function(){
    if(btn.classList.contains('armed')) disarm();
  });
})();

/* Manufacturer & Brand autocomplete — custom dropdown (native datalist
   on iOS only surfaces 3 picks above the keyboard) */
(function(){
  var input = document.querySelector('input[data-suggest]');
  if(!input) return;
  var list = input.parentElement.querySelector('.suglist');
  var sel = -1, items = [];
  /* pre-split every entry into lowercase words so partial-name queries
     like "thor aria" or "entegra anthem" match "Thor Motor Coach Aria" /
     "Entegra Coach Anthem" — each typed word only has to prefix-match
     SOME word of the entry */
  var INDEX = MFG_BRANDS.map(function(n){
    return {n:n, l:n.toLowerCase(), w:n.toLowerCase().split(/[\s\-\/]+/)};
  });
  function hide(){ list.hidden = true; sel = -1; }
  function render(){
    var q = input.value.trim().toLowerCase();
    if(!q){ hide(); return; }
    var toks = q.split(/[\s\-\/]+/).filter(Boolean);
    var starts = [], contains = [], wordy = [];
    INDEX.forEach(function(e){
      var ix = e.l.indexOf(q);
      if(ix===0){ starts.push(e.n); return; }
      if(ix>0){ contains.push(e.n); return; }
      var ok = toks.every(function(t){
        return e.w.some(function(w){ return w.indexOf(t)===0; });
      });
      if(ok) wordy.push(e.n);
    });
    items = starts.concat(contains, wordy).slice(0,12);
    if(!items.length || (items.length===1 && items[0]===input.value)){ hide(); return; }
    list.innerHTML = items.map(function(n,i){
      return '<div class="sugitem" data-i="'+i+'">'+n.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>';
    }).join('');
    list.hidden = false; sel = -1;
  }
  function choose(i){
    if(i<0 || i>=items.length) return;
    input.value = items[i];
    state.v[input.dataset.f] = items[i]; save(); refreshUnitMissing();
    hide();
  }
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', function(){ setTimeout(hide, 250); });
  input.addEventListener('keydown', function(e){
    if(list.hidden) return;
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      sel = e.key==='ArrowDown' ? Math.min(sel+1, items.length-1) : Math.max(sel-1, 0);
      Array.prototype.forEach.call(list.children, function(c,i){ c.classList.toggle('sel', i===sel); });
      list.children[sel].scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'){
      if(sel>-1){ e.preventDefault(); choose(sel); }
    }else if(e.key==='Escape'){ hide(); }
  });
  /* select on click, not pointerdown — a scroll gesture that starts on a
     row must scroll the list, not pick the row (click never fires after
     a drag). The 250ms blur delay keeps the panel alive until the tap
     lands. Desktop mousedown is prevented so the input keeps focus. */
  list.addEventListener('mousedown', function(e){ e.preventDefault(); });
  list.addEventListener('click', function(e){
    var it = e.target.closest('.sugitem');
    if(!it) return;
    choose(+it.dataset.i);
  });
})();
